<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyvro — Login / Sign Up</title>
<style>
:root{color-scheme:dark;--green:#35ce98;--text:#e7edf7;--muted:#aab7cc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at bottom right,#073b3b 0,transparent 36%),linear-gradient(145deg,#07111f,#0b1425);font-family:Arial,sans-serif;color:var(--text)}
.card{width:100%;max-width:520px;background:#111c2ef5;border:1px solid #2b3a50;border-radius:28px;padding:30px 24px;box-shadow:0 18px 60px #0005}
h1{text-align:center;color:#43d6a4;font-size:42px;margin:4px 0 14px}.subtitle{text-align:center;color:#bdc8d9;font-size:18px;margin:0 0 28px}
.tabs{display:flex;gap:12px;margin-bottom:24px}.tab{flex:1;border:1px solid #34445c;border-radius:14px;padding:15px 8px;font-size:17px;font-weight:bold;color:var(--text);background:#18283e;cursor:pointer}.tab.active{background:var(--green);color:#06251c;border-color:var(--green)}
label{display:block;font-size:16px;margin:18px 0 8px;color:#d7e0ee}input{display:block;width:100%;padding:16px;border:1px solid #40516a;border-radius:14px;background:#091322;color:white;font-size:17px;outline:none}input:focus{border-color:var(--green)}
.submit{width:100%;margin-top:24px;border:0;border-radius:14px;padding:17px;background:var(--green);color:#05261c;font-size:19px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
#message{display:none;margin-top:18px;padding:13px;border-radius:12px;line-height:1.5;overflow-wrap:anywhere}#message.ok{display:block;background:#103a31;color:#b8ffe8}#message.err{display:block;background:#451e2b;color:#ffd4dc}
.note{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:24px 0 0}.smalllink{display:block;text-align:center;color:#91eacb;margin-top:16px}
</style></head><body>
<main class="card"><h1>ZYVRO</h1><p class="subtitle">Sign in or create your account</p>
<div class="tabs"><button type="button" id="loginTab" class="tab active">Login</button><button type="button" id="signupTab" class="tab">Sign Up</button></div>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
<label for="password">Password (minimum 6 characters)</label><input id="password" type="password" placeholder="Enter password" minlength="6" autocomplete="current-password" required>
<button id="submitBtn" class="submit" type="submit">Login</button></form>
<div id="message" role="status" aria-live="polite"></div><a class="smalllink" href="./index.html">Return to game</a>
<p class="note">Virtual-game account only. Use a new password for Zyvro; never reuse your email password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // Replace these two placeholders with your Supabase Project URL and Publishable key.
  const SUPABASE_URL = https://sgpefzdgwayjxpdjetaj.supabase.co/rest/v1/
  const SUPABASE_KEY = sb_publishable_k-rm9Vf61Hv11z9yvOwalA_vtRGLDdm
  const msg=document.getElementById("message"), form=document.getElementById("authForm");
  const emailInput=document.getElementById("email"), passwordInput=document.getElementById("password");
  const submitBtn=document.getElementById("submitBtn"), loginTab=document.getElementById("loginTab"), signupTab=document.getElementById("signupTab");
  let mode="login", client=null;
  function message(t,type){msg.textContent=t;msg.className=type}
  function setMode(next){mode=next;loginTab.classList.toggle("active",mode==="login");signupTab.classList.toggle("active",mode==="signup");submitBtn.textContent=mode==="login"?"Login":"Create Account";passwordInput.autocomplete=mode==="login"?"current-password":"new-password";msg.className="";msg.textContent=""}
  loginTab.addEventListener("click",()=>setMode("login")); signupTab.addEventListener("click",()=>setMode("signup"));
  if(!window.supabase){message("Supabase library load nahi hui. Internet check karke page reload karein.","err");return}
  if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_")){message("Setup needed: auth.html mein Supabase Project URL aur Publishable Key paste karein. Secret/service_role key kabhi use na karein.","err");return}
  try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){message("Supabase configuration check karein: URL aur Publishable Key sahi honi chahiye.","err");return}
  form.addEventListener("submit",async event=>{
    event.preventDefault();if(!client)return;
    const email=emailInput.value.trim(),password=passwordInput.value;
    if(!email||password.length<6){message("Valid email aur kam se kam 6 characters ka password daalein.","err");return}
    submitBtn.disabled=true;submitBtn.textContent=mode==="login"?"Logging in...":"Creating account...";msg.className="";msg.textContent="";
    try{
      if(mode==="signup"){
        const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:window.location.href.split("#")[0].split("?")[0]}});
        if(error)throw error;
        if(data.session){message("Account ban gaya! Game khol rahe hain...","ok");window.location.href="./index.html"}
        else message("Signup request successful. Email inbox mein Supabase confirmation link check karein, confirm karke phir Login karein. Spam folder bhi dekhein.","ok");
      }else{
        const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;
        if(data.session){message("Login successful! Game khol rahe hain...","ok");window.location.href="./index.html"}
        else message("Login complete nahi hua. Email confirmation check karein aur dobara try karein.","err");
      }
    }catch(error){message("Error: "+(error&&error.message?error.message:"Unknown error"),"err")}
    finally{submitBtn.disabled=false;submitBtn.textContent=mode==="login"?"Login":"Create Account"}
  });
})();
</script></body></html>

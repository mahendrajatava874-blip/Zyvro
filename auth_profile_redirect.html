<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyvro Auth</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#07111f,#0b1425);font-family:Arial,sans-serif;color:#e7edf7}.card{width:100%;max-width:520px;background:#111c2e;border:1px solid #2b3a50;border-radius:26px;padding:28px 22px}h1{text-align:center;color:#43d6a4;font-size:40px}.sub{text-align:center;color:#bdc8d9;margin-bottom:26px}.tabs{display:flex;gap:12px}.tab{flex:1;padding:15px;border:1px solid #34445c;border-radius:13px;background:#18283e;color:#e7edf7;font-size:17px;font-weight:bold}.tab.active,.submit{background:#35ce98;color:#06251c;border-color:#35ce98}label{display:block;margin:18px 0 8px}input{width:100%;padding:16px;border:1px solid #40516a;border-radius:13px;background:#091322;color:white;font-size:17px}.submit{width:100%;padding:17px;margin-top:24px;border:0;border-radius:13px;font-size:19px;font-weight:bold}#message{display:none;margin-top:16px;padding:13px;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}#message.ok{display:block;background:#103a31;color:#b8ffe8}#message.err{display:block;background:#451e2b;color:#ffd4dc}.note{text-align:center;color:#aab7cc;font-size:14px;line-height:1.5;margin-top:22px}
</style></head><body><main class="card"><h1>ZYVRO</h1><p class="sub">Sign in or create your account</p>
<div class="tabs"><button type="button" id="loginTab" class="tab active">Login</button><button type="button" id="signupTab" class="tab">Sign Up</button></div>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Password (minimum 6 characters)</label><input id="password" type="password" minlength="6" placeholder="Enter password" required><button id="submitBtn" class="submit" type="submit">Login</button></form><div id="message" role="status"></div><p class="note">Use a new password for Zyvro, not your email password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {
 // Replace text INSIDE quotes only. Keep both quotation marks.
 const SUPABASE_URL = "https://sgpefzdgwayjxpdjetaj.supabase.co";
 const SUPABASE_KEY = "sb_publishable_k-rm9Vf61Hv11z9yvOwalA_vtRGLDdm";
 const msg=document.getElementById("message"),form=document.getElementById("authForm"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),submitBtn=document.getElementById("submitBtn"),loginTab=document.getElementById("loginTab"),signupTab=document.getElementById("signupTab");
 let mode="login",client=null;
 function showMessage(t,type){msg.textContent=t;msg.className=type}
 function setMode(next){mode=next;loginTab.classList.toggle("active",mode==="login");signupTab.classList.toggle("active",mode==="signup");submitBtn.textContent=mode==="login"?"Login":"Create Account";passwordInput.autocomplete=mode==="login"?"current-password":"new-password";msg.textContent="";msg.className=""}
 loginTab.addEventListener("click",()=>setMode("login"));
 signupTab.addEventListener("click",()=>setMode("signup"));
 if(!window.supabase){showMessage("Supabase library load nahi hui. Internet check karein.","err");return}
 if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_")){showMessage("Project URL aur Publishable Key paste karein. Quotes mat hatayein. Secret/service_role key kabhi use na karein.","err");return}
 try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){showMessage("Supabase URL/Publishable Key check karein.","err");return}
 form.addEventListener("submit",async event=>{event.preventDefault();const email=emailInput.value.trim(),password=passwordInput.value;if(!email||password.length<6){showMessage("Valid email aur minimum 6-character password daalein.","err");return}
 submitBtn.disabled=true;submitBtn.textContent=mode==="login"?"Logging in...":"Creating account...";
 try{if(mode==="signup"){const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname}});if(error)throw error;if(data.session){showMessage("Account ban gaya! Game khol rahe hain...","ok");window.location.href="./index_profile_logout.html"}else showMessage("Signup request successful. Email Inbox/Spam mein confirmation link check karein, confirm karke Login karein.","ok")}
 else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.session)window.location.href="./index_profile_logout.html"}}
 catch(error){showMessage("Error: "+(error?.message||"Unknown error"),"err")}finally{submitBtn.disabled=false;submitBtn.textContent=mode==="login"?"Login":"Create Account"}});
})();
</script></body></html>
